<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#DCC9F5" />
    <script>
      // Apply the saved appearance before the app renders to avoid a bright flash.
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("pokette.appearance.v1") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pokette" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icons/pokette.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/pokette-32.png" />
    <link rel="apple-touch-icon" href="/icons/pokette-180.png" />
    <meta
      name="description"
      content="Your little money corner. A local-first personal budget planner."
    />
    <title>Pokette Budgette ♡</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
